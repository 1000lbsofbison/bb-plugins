version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/bb-plugin-aside"
      - "/bb-plugin-crew"
      - "/bb-plugin-graph-studio"
      - "/bb-plugin-listen"
      - "/bb-plugin-slim-nav"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The SDK has to match the installed BB version, so it is bumped by hand.
      - dependency-name: "@get-bb/*"
      # Types must follow the Node version CI and BB run on, not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major bumps need a manual check in BB.
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
    groups:
      radix:
        patterns:
          - "@radix-ui/*"
      dev-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
